#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mrbs"
name = "MRBS"

description.en = "Meeting Room Booking System"
description.fr = "Système de réservation de salles de réunion" # Thanks miro5001 :)

version = "1.12.2~ynh1"

maintainers = ["felurx"]

[upstream]
license = "GPL-2.0-only"
website = "https://mrbs.sourceforge.io"
demo = "https://mrbs.sourceforge.io/demo.php"
admindoc = "https://mrbs.sourceforge.io/docs.php"
code = "https://github.com/meeting-room-booking-system/mrbs-code"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = "all"
multi_instance = "true"

ldap = "true"
sso = "true"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mrbs"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.init_admin_permission]
    type = "group"
    default = "admins"

[resources]

    [resources.system_user]

    [resources.install_dir]

    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/meeting-room-booking-system/mrbs-code/archive/refs/tags/v1.12.2.tar.gz"
        sha256 = "caf24f9b13819b0562bb1f13e877acbfa44cac74d5f532d4f1c1e3cc7c03f728"

        autoupdate.strategy = "latest_github_release"

    [resources.permissions]
    main.url = "/"
    admin = {} # Use all the defaults

    [resources.apt]
    packages = "php8.5-common, php8.5-intl, php8.5-pgsql, php8.5-ldap, postgresql"

    [resources.database]
    type = "postgresql"
